name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip check
    - name: Test Module 0 with pytest
      run: |
        # Enable later modules as their assignments are implemented.
        python -m pytest tests -x -m "task0_1 or task0_2 or task0_3 or task0_4"
    - name: Test Module 1 with pytest
      run: |
        python -m pytest tests -x -m "task1_1 or task1_2 or task1_3 or task1_4"
